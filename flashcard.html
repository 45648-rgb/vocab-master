<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards - เรียนรู้คำศัพท์</title>
  <style>
    body {
      font-family: 'Sukhumvit Set', 'Kanit', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-input {
      width: 100%;
      padding: 10px 15px;
      font-size: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
    }

    .search-input:focus {
      border-color: #4f46e5;
    }

    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 280px;
      margin: 15px 0;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-radius: 16px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .card-back {
      transform: rotateY(180deg);
      background-color: #eef2ff;
    }

    .vocab { font-size: 2.2rem; font-weight: bold; color: #2d3748; }
    .meaning { font-size: 1.5rem; color: #4338ca; font-weight: bold; }
    .hint { font-size: 0.85rem; color: #a0aec0; margin-top: 10px; }

    /* ส่วนประโยคตัวอย่างด้านหลังการ์ด */
    .example-box {
      margin-top: 15px;
      padding: 10px 12px;
      background: #ffffff;
      border-radius: 8px;
      border-left: 4px solid #4f46e5;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
    }

    .example-en {
      font-size: 0.95rem;
      color: #1e293b;
      font-style: italic;
    }

    .example-th {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 2px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { background-color: #4338ca; }
    .btn-sound { background-color: #10b981; }
    .btn-sound:hover { background-color: #059669; }
  </style>
</head>
<body>

  <div class="container">
    <h2>⚡ Flashcards 300 คำ</h2>

    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="🔍 ค้นหาคำศัพท์..." 
        oninput="searchWord()"
      >
    </div>

    <div class="card-container" onclick="flipCard()">
      <div class="card" id="flashcard">
        <!-- หน้าการ์ด (คำศัพท์) -->
        <div class="card-face card-front">
          <div class="vocab" id="vocabText">Achieve</div>
          <div class="hint">(แตะเพื่อดูคำแปลและตัวอย่างประโยค)</div>
        </div>
        <!-- หลังการ์ด (คำแปล + ตัวอย่างประโยค) -->
        <div class="card-face card-back">
          <div class="meaning" id="meaningText">บรรลุผล, สำเร็จ</div>
          <div class="example-box">
            <div class="example-en" id="exampleEn">"She worked hard to achieve her goals."</div>
            <div class="example-th" id="exampleTh">แปล: เธอทำงานหนักเพื่อบรรลุเป้าหมายของเธอ</div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-sound" onclick="speakVocab(event)">🔊 ฟังเสียง</button>
      <button onclick="nextCard()">คำถัดไป ➔</button>
    </div>
  </div>

  <script>
    // ชุดข้อมูลคำศัพท์ + ประโยคตัวอย่าง
    const flashcards = [
      {
        vocab: "Achieve",
        meaning: "บรรลุผล, สำเร็จ",
        exampleEn: "She worked hard to achieve her goals.",
        exampleTh: "เธอทำงานหนักเพื่อบรรลุเป้าหมายของเธอ"
      },
      {
        vocab: "Brilliant",
        meaning: "ฉลาดปราดเปรื่อง",
        exampleEn: "He came up with a brilliant idea.",
        exampleTh: "เขาคิดไอเดียที่ฉลาดปราดเปรื่องออกมาได้"
      },
      {
        vocab: "Challenge",
        meaning: "การท้าทาย",
        exampleEn: "Learning a new language is a great challenge.",
        exampleTh: "การเรียนภาษาใหม่คือการท้าทายที่ยิ่งใหญ่"
      },
      {
        vocab: "Dangerous",
        meaning: "อันตราย",
        exampleEn: "It is dangerous to drive too fast.",
        exampleTh: "มันอันตรายที่จะขับรถเร็วเกินไป"
      },
      {
        vocab: "Eager",
        meaning: "กระตือรือร้น",
        exampleEn: "The students were eager to learn.",
        exampleTh: "เหล่านักเรียนกระตือรือร้นที่จะเรียนรู้"
      }
    ];

    let currentIndex = 0;

    function speakVocab(event) {
      if (event) event.stopPropagation();
      const text = flashcards[currentIndex].vocab;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function flipCard() {
      const card = document.getElementById('flashcard');
      if (card) card.classList.toggle('flipped');
    }

    function nextCard() {
      const card = document.getElementById('flashcard');
      if (card) card.classList.remove('flipped');
      
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % flashcards.length;
        updateCardContent();
        speakVocab();
      }, 300);
    }

    function searchWord() {
      const searchInput = document.getElementById('searchInput');
      if (!searchInput) return;
      
      const keyword = searchInput.value.toLowerCase().trim();
      if (!keyword) return;

      const foundIndex = flashcards.findIndex(card => 
        card.vocab.toLowerCase().includes(keyword) || 
        card.meaning.includes(keyword)
      );

      if (foundIndex !== -1) {
        currentIndex = foundIndex;
        const card = document.getElementById('flashcard');
        if (card) card.classList.remove('flipped');
        updateCardContent();
      }
    }

    function updateCardContent() {
      const vocabEl = document.getElementById('vocabText');
      const meaningEl = document.getElementById('meaningText');
      const exampleEnEl = document.getElementById('exampleEn');
      const exampleThEl = document.getElementById('exampleTh');

      if (vocabEl && meaningEl) {
        const item = flashcards[currentIndex];
        vocabEl.innerText = item.vocab;
        meaningEl.innerText = item.meaning;
        exampleEnEl.innerText = `"${item.exampleEn}"`;
        exampleThEl.innerText = `แปล: ${item.exampleTh}`;
      }
    }
  </script>

</body>
</html>
