  <style>
    body {
      font-family: 'Sukhumvit Set', 'Kanit', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .btn-back-home {
      text-decoration: none;
      color: #4f46e5;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }

    .search-box input:focus {
      border-color: #4f46e5;
    }

    .card-counter {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 220px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      border-radius: 16px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      padding: 20px;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
    }

    .card-front { background: #ffffff; }
    .card-back {
      transform: rotateY(180deg);
      background-color: #eef2ff;
      border-color: #c7d2fe;
    }

    .vocab { font-size: 2rem; font-weight: bold; color: #1e293b; }
    .meaning { font-size: 1.3rem; color: #334155; }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background-color: #4f46e5;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover { background-color: #4338ca; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

    .btn-sound { background-color: #10b981; }
    .btn-sound:hover { background-color: #059669; }
    .btn-nav { background-color: #f1f5f9; color: #334155; }
    .btn-nav:hover { background-color: #e2e8f0; }
  </style>
</head>

  <div class="container">

    <div class="search-box">

    // กรองคำศัพท์ซ้ำออกและจำกัดไว้ที่ 300 คำพอดี
    const uniqueFlashcards = [];
    const seen = new Set();

    for (const item of rawFlashcards) {
      const lowerVocab = item.vocab.toLowerCase();
      if (!seen.has(lowerVocab)) {
        seen.add(lowerVocab);
        uniqueFlashcards.push(item);
      }
      if (uniqueFlashcards.length >= 300) break;
    }

    const allFlashcards = uniqueFlashcards;
    let currentList = [...allFlashcards];
    let currentIndex = 0;

    function speakVocab(event) {
      if (event) event.stopPropagation();
      if (currentList.length === 0) return;

      const text = currentList[currentIndex].vocab;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function flipCard() {
      if (currentList.length === 0) return;
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function updateCardDisplay() {
      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');

      if (currentList.length === 0) {
        document.getElementById('vocabText').innerText = "ไม่พบคำศัพท์";
        document.getElementById('meaningText').innerText = "ลองค้นหาด้วยคำอื่น";
        document.getElementById('cardCounter').innerText = "0 / 0";
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        return;
      }

      document.getElementById('vocabText').innerText = currentList[currentIndex].vocab;
      document.getElementById('meaningText').innerText = currentList[currentIndex].meaning;
      document.getElementById('cardCounter').innerText = `คำที่ ${currentIndex + 1} / ${currentList.length}`;
      
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === currentList.length - 1;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCardDisplay();
        speakVocab();
      }
    }

    function nextCard() {
      if (currentIndex < currentList.length - 1) {
        currentIndex++;
        updateCardDisplay();
        speakVocab();
      }
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      currentList = allFlashcards.filter(item => 
        item.vocab.toLowerCase().includes(query) || 
        item.meaning.toLowerCase().includes(query)
      );
      currentIndex = 0;
      updateCardDisplay();
    }

    updateCardDisplay();
