<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Flashcard App (550 Words with Audio & Search)</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary-color);
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        select, input[type="text"], button {
            padding: 10px 15px;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            outline: none;
            box-sizing: border-box;
        }

        select, input[type="text"] {
            flex: 1;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 340px;
            height: 250px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #e0e7ff;
            color: #312e81;
        }

        .word-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .word {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .card-back .word {
            color: #312e81;
        }

        .audio-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
            color: var(--primary-color);
        }

        .audio-btn:hover {
            background-color: rgba(79, 70, 229, 0.1);
        }

        .pos {
            font-style: italic;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .translation {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .example {
            font-size: 0.95rem;
            color: #4b5563;
        }

        .category-tag {
            font-size: 0.8rem;
            background: #e5e7eb;
            padding: 3px 8px;
            border-radius: 12px;
            margin-top: 10px;
            color: #374151;
        }

        .navigation {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #counter {
            font-size: 1rem;
            font-weight: 600;
        }
    </style>
</head>

    <div class="controls">

            <option value="Business & Work">Business & Work</option>

        <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์หรือคำแปล..." oninput="filterVocabulary()">
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="card-face card-front">
                <div class="pos" id="cardPos">pos</div>
                <div class="word-container">
                    <div class="word" id="cardWord">Word</div>
                    <button class="audio-btn" onclick="playAudio(event)" title="ฟังเสียงอ่าน">🔊</button>
                </div>
                <div class="category-tag" id="cardCategory">Category</div>
                <div style="font-size: 0.8rem; color: #9ca3af; margin-top: 10px;">(คลิกการ์ดเพื่อดูคำแปล)</div>
            </div>
            <div class="card-face card-back">
                <div class="translation" id="cardTranslation">คำแปล</div>
                <div class="example" id="cardExample">Example sentence.</div>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button onclick="prevCard()">&#10094; ก่อนหน้า</button>
        <span id="counter">1 / 1</span>
        <button onclick="nextCard()">ถัดไป &#10095;</button>
    </div>

        // กรองคำซ้ำอย่างแม่นยำ
        const uniqueMap = new Map();
        rawVocabularyData.forEach(item => {
            const lowerWord = item.word.toLowerCase();
            if (!uniqueMap.has(lowerWord)) {
                uniqueMap.set(lowerWord, item);
            }
        });
        
        let vocabularyData = Array.from(uniqueMap.values());

        let currentIndex = 0;
        let filteredData = [...vocabularyData];

        const card = document.getElementById('card');
        const cardWord = document.getElementById('cardWord');
        const cardPos = document.getElementById('cardPos');
        const cardCategory = document.getElementById('cardCategory');
        const cardTranslation = document.getElementById('cardTranslation');
        const cardExample = document.getElementById('cardExample');
        const counter = document.getElementById('counter');
        const categoryFilter = document.getElementById('categoryFilter');
        const searchInput = document.getElementById('searchInput');
        const totalSubtitle = document.getElementById('totalSubtitle');

        function updateCard() {
            if (filteredData.length === 0) {
                cardWord.textContent = "ไม่พบคำศัพท์";
                cardPos.textContent = "";
                cardCategory.textContent = "";
                cardTranslation.textContent = "-";
                cardExample.textContent = "ลองเปลี่ยนคำค้นหาหรือหมวดหมู่ดูใหม่อีกครั้ง";
                counter.textContent = "0 / 0";
                return;
            }

            const current = filteredData[currentIndex];
            cardWord.textContent = current.word;
            cardPos.textContent = current.pos;
            cardCategory.textContent = current.category;
            cardTranslation.textContent = current.translation;
            cardExample.textContent = `"${current.example}"`;

            card.classList.remove('flipped');
            counter.textContent = `${currentIndex + 1} / ${filteredData.length}`;
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function nextCard() {
            if (filteredData.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredData.length;
            updateCard();
        }

        function prevCard() {
            if (filteredData.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
            updateCard();
        }

        // ฟังก์ชันกรองคำศัพท์ (รองรับทั้ง หมวดหมู่ และ ช่องค้นหา คำศัพท์ภาษาอังกฤษ/คำแปลไทย)
        function filterVocabulary() {
            const selectedCategory = categoryFilter.value;
            const query = searchInput.value.toLowerCase().trim();

            filteredData = vocabularyData.filter(item => {
                const matchesCategory = (selectedCategory === "All" || item.category === selectedCategory);
                const matchesSearch = item.word.toLowerCase().includes(query) || item.translation.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            currentIndex = 0;
            updateCard();
        }

        // ฟังก์ชันอ่านออกเสียงภาษาอังกฤษ
        function playAudio(event) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                if (filteredData.length === 0) return;
                const currentWord = filteredData[currentIndex].word;
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับระบบเสียงพูดอัตโนมัติ");
            }
        }

        // อัปเดตข้อความแสดงจำนวนคำทั้งหมด
        totalSubtitle.textContent = `คลังคำศัพท์สะสมรวมทั้งหมด ${vocabularyData.length} คำ`;

        // โหลดการ์ดใบแรกเมื่อเปิดเว็บ
        updateCard();
    </script>
