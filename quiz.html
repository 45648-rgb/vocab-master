<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game - ระบบควิซหลากหลายรูปแบบ + High Score</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: 'Sukhumvit Set', 'Kanit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .quiz-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
    }

    /* Header Nav & Stats */
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-home {
      text-decoration: none;
      color: var(--primary);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .highscore-badge {
      background: #fef3c7;
      color: #b45309;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 10px 16px;
      border-radius: 14px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .streak-badge {
      color: #f97316;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Timer Bar */
    .timer-container {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--primary);
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* Question Box */
    .question-box {
      text-align: center;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-type-badge {
      align-self: center;
      background: #e0e7ff;
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 6px;
    }

    .question-word {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Power-ups / Helpers */
    .powerups {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-powerup {
      background: #e0e7ff;
      color: var(--primary);
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-powerup:hover:not(:disabled) {
      background: var(--primary);
      color: white;
    }

    .btn-powerup:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Choice Options Grid */
    .options-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-option {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-option:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f5f3ff;
      transform: translateY(-2px);
    }

    .btn-option.correct {
      background: #d1fae5 !important;
      border-color: var(--success) !important;
      color: #065f46 !important;
    }

    .btn-option.wrong {
      background: #fee2e2 !important;
      border-color: var(--danger) !important;
      color: #991b1b !important;
    }

    .btn-option:disabled {
      cursor: not-allowed;
    }

    /* Typing Question Input */
    .typing-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .typing-input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      font-weight: bold;
    }

    .typing-input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Animations */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Result View */
    .result-box {
      text-align: center;
      display: none;
    }

    .new-record-badge {
      background: #ef4444;
      color: white;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 10px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .result-score {
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary);
      margin: 10px 0;
    }

    .btn-restart {
      width: 100%;
      padding: 14px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-restart:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="quiz-card" id="quizCard">
    <div id="quizView">
      <div class="header-nav">
        <a href="index.html" class="btn-home">🏠 หน้าหลัก</a>
        <div class="highscore-badge">👑 สถิติสูงสุด: <span id="highScoreText">0</span></div>
      </div>

      <div class="stats-bar">
        <div>คะแนน: <span id="scoreText" style="color:var(--primary);">0</span></div>
        <span id="questionProgress" style="font-size:0.85rem; color:#64748b;">ข้อที่ 1/10</span>
        <div class="streak-badge">🔥 <span id="streakText">0</span></div>
      </div>

      <div class="timer-container">
        <div class="timer-bar" id="timerBar"></div>
      </div>

      <div class="question-box">
        <div class="question-type-badge" id="modeBadge">โหมดตัวเลือก</div>
        <div class="question-title" id="questionTitle">คำนี้แปลว่าอะไร?</div>
        <div class="question-word" id="vocabQuestion">Loading...</div>
      </div>

      <div class="powerups">
        <button class="btn-powerup" id="btn5050" onclick="use5050()">🪄 50:50</button>
        <button class="btn-powerup" id="btnSkip" onclick="useSkip()">⏭️ ข้ามข้อนี้</button>
      </div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="typing-container" id="typingGrid" style="display: none;">
        <input type="text" class="typing-input" id="typingInput" placeholder="พิมพ์คำศัพท์ภาษาอังกฤษที่นี่..." autocomplete="off">
        <button class="btn-submit" onclick="checkTypingAnswer()">ส่งคำตอบ</button>
      </div>
    </div>

    <div class="result-box" id="resultView">
      <div id="newRecordBadge" class="new-record-badge" style="display: none;">🎉 สถิติใหม่สูงสุด! 🎉</div>
      <h2 style="margin-bottom:5px; margin-top: 5px;">จบการทดสอบ!</h2>
      <p style="color:#64748b; margin-top:0;">นี่คือคะแนนรวมของคุณ</p>
      <div class="result-score" id="finalScore">0 / 10</div>
      <p id="accuracyText" style="font-weight:bold; color:#475569; margin-bottom:15px;">ความแม่นยำ: 0%</p>
      <p style="font-size:0.9rem; color:#64748b; margin-bottom:25px;">คะแนนสูงสุดตลอดกาล: <b id="bestScoreResult">0</b> คะแนน</p>
      <button class="btn-restart" onclick="startQuiz()">🔄 เล่นอีกครั้ง</button>
    </div>
  </div>

  <script>
    const vocabData = [
      { vocab: "Ability", meaning: "ความสามารถ" },
      { vocab: "Abroad", meaning: "ต่างประเทศ" },
      { vocab: "Absorb", meaning: "ดูดซับ" },
      { vocab: "Accept", meaning: "ยอมรับ" },
      { vocab: "Accident", meaning: "อุบัติเหตุ" },
      { vocab: "Achieve", meaning: "บรรลุเป้าหมาย" },
      { vocab: "Accurate", meaning: "ถูกต้องแม่นยำ" },
      { vocab: "Adapt", meaning: "ปรับตัว" },
      { vocab: "Admire", meaning: "ชื่นชม" },
      { vocab: "Advance", meaning: "ก้าวหน้า" },
      { vocab: "Advantage", meaning: "ข้อดี" },
      { vocab: "Analyze", meaning: "วิเคราะห์" },
      { vocab: "Ancient", meaning: "โบราณ" },
      { vocab: "Apologize", meaning: "ขอโทษ" },
      { vocab: "Attract", meaning: "ดึงดูด" },
      { vocab: "Benefit", meaning: "ผลประโยชน์" },
      { vocab: "Calculate", meaning: "คำนวณ" },
      { vocab: "Challenge", meaning: "การท้าทาย" },
      { vocab: "Create", meaning: "สร้างสรรค์" },
      { vocab: "Develop", meaning: "พัฒนา" }
    ];

    const TOTAL_QUESTIONS = 10;
    const TIME_LIMIT = 10;
    
    let quizQuestions = [];
    let currentQuestionIdx = 0;
    let score = 0;
    let streak = 0;
    let highScore = 0;
    let timerInterval = null;
    let timeLeft = TIME_LIMIT;
    let isAnswered = false;
    let currentMode = 'enToTh'; // 'enToTh', 'thToEn', 'typing'

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'wrong') {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(196, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    function loadHighScore() {
      highScore = parseInt(localStorage.getItem('quiz_highscore')) || 0;
      document.getElementById('highScoreText').innerText = highScore;
    }

    function saveHighScore(newScore) {
      if (newScore > highScore) {
        highScore = newScore;
        localStorage.setItem('quiz_highscore', highScore);
        document.getElementById('highScoreText').innerText = highScore;
        return true; // ทำลายสถิติใหม่
      }
      return false;
    }

    function startQuiz() {
      loadHighScore();
      const shuffled = [...vocabData].sort(() => 0.5 - Math.random());
      quizQuestions = shuffled.slice(0, TOTAL_QUESTIONS);
      
      currentQuestionIdx = 0;
      score = 0;
      streak = 0;
      
      document.getElementById('scoreText').innerText = score;
      document.getElementById('streakText').innerText = streak;
      document.getElementById('btn5050').disabled = false;
      document.getElementById('btnSkip').disabled = false;
      document.getElementById('quizView').style.display = 'block';
      document.getElementById('resultView').style.display = 'none';

      loadQuestion();
    }

    function loadQuestion() {
      isAnswered = false;
      clearInterval(timerInterval);

      const q = quizQuestions[currentQuestionIdx];
      document.getElementById('questionProgress').innerText = `ข้อที่ ${currentQuestionIdx + 1}/${TOTAL_QUESTIONS}`;

      // สุ่มโหมดคำถาม 3 รูปแบบ
      const modes = ['enToTh', 'thToEn', 'typing'];
      currentMode = modes[Math.floor(Math.random() * modes.length)];

      const optionsGrid = document.getElementById('optionsGrid');
      const typingGrid = document.getElementById('typingGrid');
      const btn5050 = document.getElementById('btn5050');

      if (currentMode === 'enToTh') {
        document.getElementById('modeBadge').innerText = '🇬🇧 ➡️ 🇹🇭 เลือกคำแปลภาษาไทย';
        document.getElementById('questionTitle').innerText = 'คำศัพท์นี้แปลว่าอะไร?';
        document.getElementById('vocabQuestion').innerText = q.vocab;
        optionsGrid.style.display = 'grid';
        typingGrid.style.display = 'none';
        btn5050.style.display = 'inline-block';
        setupMultipleChoiceOptions(q.meaning, 'meaning');

      } else if (currentMode === 'thToEn') {
        document.getElementById('modeBadge').innerText = '🇹🇭 ➡️ 🇬🇧 เลือกคำศัพท์ภาษาอังกฤษ';
        document.getElementById('questionTitle').innerText = 'คำศัพท์ภาษาอังกฤษของคำนี้คืออะไร?';
        document.getElementById('vocabQuestion').innerText = q.meaning;
        optionsGrid.style.display = 'grid';
        typingGrid.style.display = 'none';
        btn5050.style.display = 'inline-block';
        setupMultipleChoiceOptions(q.vocab, 'vocab');

      } else if (currentMode === 'typing') {
        document.getElementById('modeBadge').innerText = '✍️ พิมพ์คำตอบสะกดคำศัพท์';
        document.getElementById('questionTitle').innerText = 'พิมพ์คำศัพท์ภาษาอังกฤษของคำว่า:';
        document.getElementById('vocabQuestion').innerText = q.meaning;
        optionsGrid.style.display = 'none';
        typingGrid.style.display = 'flex';
        btn5050.style.display = 'none'; // โหมดพิมพ์ไม่มี 50:50
        
        const typingInput = document.getElementById('typingInput');
        typingInput.value = '';
        typingInput.disabled = false;
        setTimeout(() => typingInput.focus(), 100);
      }

      startTimer();
    }

    function setupMultipleChoiceOptions(correctValue, keyName) {
      const wrongOptions = vocabData
        .filter(item => item[keyName] !== correctValue)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3)
        .map(item => item[keyName]);

      const options = [...wrongOptions, correctValue].sort(() => 0.5 - Math.random());
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkChoiceAnswer(opt, correctValue, btn);
        optionsGrid.appendChild(btn);
      });
    }

    function startTimer() {
      timeLeft = TIME_LIMIT;
      const timerBar = document.getElementById('timerBar');
      timerBar.style.width = '100%';
      timerBar.style.backgroundColor = 'var(--primary)';

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        const percentage = (timeLeft / TIME_LIMIT) * 100;
        timerBar.style.width = `${percentage}%`;

        if (percentage < 30) {
          timerBar.style.backgroundColor = 'var(--danger)';
        } else if (percentage < 60) {
          timerBar.style.backgroundColor = 'var(--warning)';
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 100);
    }

    function checkChoiceAnswer(selected, correct, btn) {
      if (isAnswered) return;
      isAnswered = true;
      clearInterval(timerInterval);

      const allBtns = document.querySelectorAll('.btn-option');
      allBtns.forEach(b => b.disabled = true);

      if (selected === correct) {
        btn.classList.add('correct');
        handleCorrectAnswer();
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
        handleWrongAnswer();
      }

      setTimeout(nextQuestion, 1200);
    }

    function checkTypingAnswer() {
      if (isAnswered) return;
      isAnswered = true;
      clearInterval(timerInterval);

      const input = document.getElementById('typingInput');
      input.disabled = true;

      const userAns = input.value.trim().toLowerCase();
      const correctAns = quizQuestions[currentQuestionIdx].vocab.toLowerCase();

      if (userAns === correctAns) {
        input.style.borderColor = 'var(--success)';
        input.style.background = '#d1fae5';
        handleCorrectAnswer();
      } else {
        input.style.borderColor = 'var(--danger)';
        input.style.background = '#fee2e2';
        input.value = `ผิด! คำที่ถูกต้องคือ: ${quizQuestions[currentQuestionIdx].vocab}`;
        handleWrongAnswer();
      }

      setTimeout(nextQuestion, 1500);
    }

    function handleCorrectAnswer() {
      score++;
      streak++;
      playSound('correct');
      document.getElementById('scoreText').innerText = score;
      document.getElementById('streakText').innerText = streak;
    }

    function handleWrongAnswer() {
      streak = 0;
      playSound('wrong');
      document.getElementById('streakText').innerText = streak;
      document.getElementById('quizCard').classList.add('shake');
      setTimeout(() => document.getElementById('quizCard').classList.remove('shake'), 400);
    }

    function handleTimeout() {
      if (isAnswered) return;
      isAnswered = true;
      handleWrongAnswer();

      if (currentMode === 'typing') {
        const input = document.getElementById('typingInput');
        input.disabled = true;
        input.style.background = '#fee2e2';
        input.value = `หมดเวลา! คำตอบคือ: ${quizQuestions[currentQuestionIdx].vocab}`;
      } else {
        const correct = currentMode === 'enToTh' ? quizQuestions[currentQuestionIdx].meaning : quizQuestions[currentQuestionIdx].vocab;
        document.querySelectorAll('.btn-option').forEach(b => {
          b.disabled = true;
          if (b.innerText === correct) b.classList.add('correct');
        });
      }

      setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
      currentQuestionIdx++;
      if (currentQuestionIdx < TOTAL_QUESTIONS) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function use5050() {
      if (isAnswered || currentMode === 'typing') return;
      const q = quizQuestions[currentQuestionIdx];
      const correct = currentMode === 'enToTh' ? q.meaning : q.vocab;
      const allBtns = Array.from(document.querySelectorAll('.btn-option'));
      const wrongBtns = allBtns.filter(b => b.innerText !== correct);

      wrongBtns.sort(() => 0.5 - Math.random()).slice(0, 2).forEach(b => {
        b.style.visibility = 'hidden';
      });

      document.getElementById('btn5050').disabled = true;
    }

    function useSkip() {
      if (isAnswered) return;
      document.getElementById('btnSkip').disabled = true;
      nextQuestion();
    }

    function showResult() {
      document.getElementById('quizView').style.display = 'none';
      document.getElementById('resultView').style.display = 'block';
      
      document.getElementById('finalScore').innerText = `${score} / ${TOTAL_QUESTIONS}`;
      const accuracy = (score / TOTAL_QUESTIONS) * 100;
      document.getElementById('accuracyText').innerText = `ความแม่นยำ: ${accuracy}%`;

      const isNewRecord = saveHighScore(score);
      document.getElementById('bestScoreResult').innerText = highScore;

      const recordBadge = document.getElementById('newRecordBadge');
      if (isNewRecord && score > 0) {
        recordBadge.style.display = 'inline-block';
      } else {
        recordBadge.style.display = 'none';
      }

      if (accuracy >= 70 || isNewRecord) {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    // กด Enter ในช่องพิมพ์เพื่อส่งคำตอบ
    document.getElementById('typingInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkTypingAnswer();
      }
    });

    startQuiz();
  </script>
</body>
</html>
