<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Quiz - เฉลยคำแปล</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 650px;
        }
        h2 {
            color: #2f3640;
            text-align: center;
            margin-top: 0;
        }
        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-mode {
            padding: 15px;
            background-color: #f1f2f6;
            border: 2px solid #dfe4ea;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #2f3640;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-mode:hover {
            background-color: #e3e4e8;
            border-color: #74b9ff;
        }
        .header-stats {
            display: flex;
            justify-content: space-between;
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #2f3640;
            margin-bottom: 15px;
        }
        .timer-bar-container {
            width: 100%;
            height: 8px;
            background-color: #dfe4ea;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: #2ed573;
            transition: width 1s linear;
        }
        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2f3640;
            text-align: center;
        }
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-choice {
            padding: 14px;
            background-color: #f8f9fa;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn-choice:hover:not(:disabled) {
            background-color: #74b9ff;
            color: white;
            border-color: #74b9ff;
        }
        .typing-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .typing-box input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }
        .typing-box input:focus {
            border-color: #3498db;
        }
        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        #feedback-text {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 24px;
        }
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .btn-back {
            background-color: #718093;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            text-align: left;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
        }
        .btn-restart {
            width: 100%;
            padding: 12px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-restart:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- หน้าจอเลือกโหมดเกม -->
        <div id="menu-screen">
            <h2>🎯 เลือกรูปแบบการทดสอบคำศัพท์</h2>
            <div class="mode-selection">
                <button class="btn-mode" onclick="startQuiz('multiple')">
                    <span style="font-size: 24px;">🔤</span>
                    <div>
                        <div>โหมด 4 ตัวเลือก (Multiple Choice)</div>
                        <div style="font-size: 12px; color: #718093; font-weight: normal;">เลือกคำแปลภาษาไทยที่ถูกต้อง</div>
                    </div>
                </button>
                <button class="btn-mode" onclick="startQuiz('typing')">
                    <span style="font-size: 24px;">⌨️</span>
                    <div>
                        <div>โหมดพิมพ์คำศัพท์ (Typing Quiz)</div>
                        <div style="font-size: 12px; color: #718093; font-weight: normal;">ดูคำแปลภาษาไทย แล้วพิมพ์คำศัพท์ภาษาอังกฤษ</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- หน้าจอเล่นเกม -->
        <div id="quiz-screen" style="display: none;">
            <div class="header-stats">
                <span id="score-display">🏆 XP: 0</span>
                <span id="streak-display">🔥 Streak: 0</span>
                <span id="timer-display">⏱️ 15s</span>
            </div>
            
            <div class="timer-bar-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>

            <div class="question" id="question-text">กำลังโหลด...</div>
            
            <!-- โหมด 4 ตัวเลือก -->
            <div class="choices-grid" id="choices-container" style="display: none;"></div>

            <!-- โหมดพิมพ์ตอบ -->
            <div class="typing-box" id="typing-container" style="display: none;">
                <input type="text" id="user-answer-input" placeholder="พิมพ์คำศัพท์ภาษาอังกฤษ..." autocomplete="off" onkeypress="handleKeyPress(event)">
                <button class="btn-submit" onclick="submitTypedAnswer()">ส่งคำตอบ</button>
            </div>

            <div id="feedback-text"></div>

            <div class="footer-nav">
                <button class="btn-back" onclick="returnToMenu()">🏠 กลับหน้าหลัก</button>
                <span id="progress-indicator" style="font-size: 14px; color: #718093;">ข้อ 1 / 10</span>
            </div>
        </div>

        <!-- หน้าจอสรุปผล -->
        <div id="result-screen" style="display: none;">
            <h2>📊 สรุปผลการทดสอบ</h2>
            <div class="stats-grid" id="stats-summary"></div>
            <button class="btn-restart" onclick="returnToMenu()">เลือกโหมดอื่น / เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        const allVocabulary = [
            { word: "Ability", meaning: "ความสามารถ" },
            { word: "Absolute", meaning: "แน่นอน, สมบูรณ์" },
            { word: "Accelerate", meaning: "เร่งความเร็ว" },
            { word: "Accept", meaning: "ยอมรับ" },
            { word: "Access", meaning: "การเข้าถึง" },
            { word: "Accomplish", meaning: "ทำสำเร็จ" },
            { word: "Accurate", meaning: "แม่นยำ" },
            { word: "Achieve", meaning: "บรรลุเป้าหมาย" },
            { word: "Acknowledge", meaning: "ยอมรับ, รับรู้" },
            { word: "Acquire", meaning: "ได้รับ" },
            { word: "Advertise", meaning: "โฆษณา" },
            { word: "Advice", meaning: "คำแนะนำ" },
            { word: "Affect", meaning: "มีผลกระทบ" },
            { word: "Agency", meaning: "หน่วยงาน" },
            { word: "Agreement", meaning: "ข้อตกลง" },
            { word: "Ambitious", meaning: "ทะเยอทะยาน" },
    { word: "Amount", meaning: "จำนวน" },
    { word: "Analysis", meaning: "การวิเคราะห์" },
    { word: "Analyze", meaning: "วิเคราะห์" },
    { word: "Ancient", meaning: "โบราณ" },
    { word: "Angry", meaning: "โกรธ" },
    { word: "Animal", meaning: "สัตว์" },
    { word: "Announce", meaning: "ประกาศ" },
    { word: "Annual", meaning: "ประจำปี" },
    { word: "Another", meaning: "อีกอัน, อีกคน" },
    { word: "Answer", meaning: "คำตอบ, ตอบ" },
    { word: "Anxiety", meaning: "ความวิตกกังวล" },
    { word: "Anxious", meaning: "กระวนกระวายใจ" },
    { word: "Any", meaning: "ใดๆ, บ้าง" },
    { word: "Anybody", meaning: "ใครก็ตาม" },
    { word: "Anymore", meaning: "อีกต่อไป" },
    { word: "Anyone", meaning: "ใครก็ตาม" },
    { word: "Anything", meaning: "สิ่งใดๆ" },
    { word: "Anyway", meaning: "อย่างไรก็ตาม" },
    { word: "Anywhere", meaning: "ที่ไหนก็ตาม" },
    { word: "Apart", meaning: "แยกออกจากกัน" },
    { word: "Apologize", meaning: "ขอโทษ" },
    { word: "Apparent", meaning: "ชัดเจน" },
    { word: "Appeal", meaning: "ดึงดูด, คำร้องอุทธรณ์" },
    { word: "Appear", meaning: "ปรากฏ" },
    { word: "Appearance", meaning: "ลักษณะที่ปรากฏ" },
    { word: "Appetite", meaning: "ความอยากอาหาร" },
    { word: "Applaud", meaning: "ปรบมือ" },
    { word: "Apple", meaning: "แอปเปิยว์" },
    { word: "Application", meaning: "ใบสมัคร, แอปพลิเคชัน" },
    { word: "Apply", meaning: "สมัคร, ประยุกต์ใช้" },
    { word: "Appoint", meaning: "แต่งตั้ง, นัดหมาย" },
    { word: "Appreciate", meaning: "ซาบซึ้ง, เห็นคุณค่า" },
    { word: "Approach", meaning: "เข้าใกล้, วิธีการ" },
    { word: "Appropriate", meaning: "เหมาะสม" },
    { word: "Approval", meaning: "การอนุมัติ" },
    { word: "Approve", meaning: "อนุมัติ" },
    { word: "Approximate", meaning: "ประมาณ" },
    { word: "Architect", meaning: "สถาปนิก" },
    { word: "Architecture", meaning: "สถาปัตยกรรม" },
    { word: "Area", meaning: "พื้นที่" },
    { word: "Argue", meaning: "โต้เถียง" },
    { word: "Argument", meaning: "การโต้เถียง" },
    { word: "Arise", meaning: "เกิดขึ้น" },
    { word: "Arm", meaning: "แขน" },
    { word: "Army", meaning: "กองทัพ" },
    { word: "Around", meaning: "รอบๆ" },
    { word: "Arrange", meaning: "จัดเตรียม" },
    { word: "Arrangement", meaning: "การจัดเตรียม" },
    { word: "Arrest", meaning: "จับกุม" }
        ];

        let currentMode = 'multiple';
        let currentQuestions = [];
        let currentIndex = 0;
        let xp = 0;
        let streak = 0;
        let maxStreak = 0;
        let correctCount = 0;
        let wrongCount = 0;

        const TOTAL_TIME = 15;
        let timeLeft = TOTAL_TIME;
        let timerInterval;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz(mode) {
            currentMode = mode;
            xp = 0;
            streak = 0;
            maxStreak = 0;
            correctCount = 0;
            wrongCount = 0;
            currentIndex = 0;

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';

            let shuffledVocab = [...allVocabulary];
            shuffle(shuffledVocab);
            currentQuestions = shuffledVocab.slice(0, 10);

            loadQuestion();
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TOTAL_TIME;
            document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
            let timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
                timerBar.style.width = `${(timeLeft / TOTAL_TIME) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            streak = 0;
            wrongCount++;
            const currentItem = currentQuestions[currentIndex];
            document.getElementById('feedback-text').innerHTML = `<span style="color: #ff4757;">⏱️ หมดเวลา! คำตอบที่ถูกต้องคือ: <b>${currentItem.word}</b> (${currentItem.meaning})</span>`;
            updateStatsDisplay();

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1800);
        }

        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                clearInterval(timerInterval);
                showResult();
                return;
            }

            startTimer();
            document.getElementById('feedback-text').innerHTML = '';
            document.getElementById('progress-indicator').innerText = `ข้อ ${currentIndex + 1} / ${currentQuestions.length}`;

            const currentItem = currentQuestions[currentIndex];

            if (currentMode === 'multiple') {
                document.getElementById('choices-container').style.display = 'grid';
                document.getElementById('typing-container').style.display = 'none';
                
                document.getElementById('question-text').innerText = `คำศัพท์: "${currentItem.word}" หมายถึงอะไร?`;
                
                let wrongChoices = allVocabulary.filter(v => v.word !== currentItem.word);
                shuffle(wrongChoices);
                let choices = [currentItem, wrongChoices[0], wrongChoices[1], wrongChoices[2]];
                shuffle(choices);

                let choicesHTML = '';
                choices.forEach(choice => {
                    choicesHTML += `<button class="btn-choice" onclick="submitMultipleChoice('${choice.word}', '${currentItem.word}', '${currentItem.meaning}')">${choice.meaning}</button>`;
                });
                document.getElementById('choices-container').innerHTML = choicesHTML;

            } else if (currentMode === 'typing') {
                document.getElementById('choices-container').style.display = 'none';
                document.getElementById('typing-container').style.display = 'flex';

                document.getElementById('question-text').innerText = `แปลว่า: "${currentItem.meaning}"`;
                const inputField = document.getElementById('user-answer-input');
                inputField.value = '';
                inputField.disabled = false;
                inputField.focus();
            }
        }

        function submitMultipleChoice(selectedWord, correctWord, correctMeaning) {
            clearInterval(timerInterval);
            const buttons = document.querySelectorAll('.btn-choice');
            buttons.forEach(btn => btn.disabled = true);

            const feedbackText = document.getElementById('feedback-text');

            if (selectedWord === correctWord) {
                correctCount++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                xp += 10 + (streak * 2) + (timeLeft * 1);
                feedbackText.innerHTML = `<span style="color: #2ed573;">🎉 ถูกต้อง! (${correctWord} = ${correctMeaning})</span>`;
            } else {
                wrongCount++;
                streak = 0;
                feedbackText.innerHTML = `<span style="color: #ff4757;">❌ ผิด! คำตอบที่ถูกต้องคือ: <b>${correctWord}</b> (${correctMeaning})</span>`;
            }

            updateStatsDisplay();
            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1800);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitTypedAnswer();
            }
        }

        function submitTypedAnswer() {
            clearInterval(timerInterval);
            const inputField = document.getElementById('user-answer-input');
            const userAnswer = inputField.value.trim().toLowerCase();
            const currentItem = currentQuestions[currentIndex];
            const correctAnswer = currentItem.word.toLowerCase();

            inputField.disabled = true;
            const feedbackText = document.getElementById('feedback-text');

            if (userAnswer === correctAnswer) {
                correctCount++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                xp += 10 + (streak * 2) + (timeLeft * 1);
                feedbackText.innerHTML = `<span style="color: #2ed573;">🎉 ถูกต้อง! (${currentItem.word} = ${currentItem.meaning})</span>`;
            } else {
                wrongCount++;
                streak = 0;
                feedbackText.innerHTML = `<span style="color: #ff4757;">❌ ผิด! คำที่ถูกต้องคือ: <b>${currentItem.word}</b> (${currentItem.meaning})</span>`;
            }

            updateStatsDisplay();
            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1800);
        }

        function updateStatsDisplay() {
            document.getElementById('score-display').innerText = `🏆 XP: ${xp}`;
            document.getElementById('streak-display').innerText = `🔥 Streak: ${streak}`;
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let accuracy = Math.round((correctCount / currentQuestions.length) * 100) || 0;

            document.getElementById('stats-summary').innerHTML = `
                <div>✨ <b>แต้ม XP รวม:</b> ${xp} XP</div>
                <div>🎯 <b>ความแม่นยำ:</b> ${accuracy}%</div>
                <div>✅ <b>ตอบถูก:</b> ${correctCount} ข้อ</div>
                <div>❌ <b>ตอบผิด/หมดเวลา:</b> ${wrongCount} ข้อ</div>
                <div>🔥 <b>Streak สูงสุด:</b> ${maxStreak} ข้อติด</div>
            `;
        }
    </script>
</body>
</html>
