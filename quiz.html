<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบคำศัพท์ 550 คำ - Gamified Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 650px;
        }
        .header-stats {
            display: flex;
            justify-content: space-between;
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #2f3640;
            margin-bottom: 20px;
        }
        .timer-bar-container {
            width: 100%;
            height: 8px;
            background-color: #dfe4ea;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: #2ed573;
            transition: width 1s linear;
        }
        h2 {
            color: #2f3640;
            text-align: center;
            margin-top: 0;
        }
        .quiz-info {
            font-size: 13px;
            color: #718093;
            margin-bottom: 15px;
            text-align: center;
        }
        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2f3640;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: 0.2s;
        }
        .options button:hover:not(:disabled) {
            background-color: #e3f2fd;
            border-color: #3498db;
        }
        .options button.hidden-option {
            display: none;
        }
        .lifelines {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .btn-lifeline, .btn-skip {
            flex: 1;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-lifeline { background-color: #ffa502; }
        .btn-lifeline:hover:not(:disabled) { background-color: #ff7f00; }
        .btn-skip { background-color: #ff4757; }
        .btn-skip:hover:not(:disabled) { background-color: #ff6b81; }
        .btn-lifeline:disabled, .btn-skip:disabled {
            background-color: #ced6e0;
            cursor: not-allowed;
        }
        #result-container {
            text-align: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            text-align: left;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
        }
        .btn-restart {
            width: 100%;
            padding: 12px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-restart:hover { background-color: #26af5f; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h2>⚔️ ศัพท์ 550 คำ Challenge</h2>
        
        <div id="quiz-app">
            <div class="header-stats">
                <span id="score-display">🏆 แต้ม XP: 0</span>
                <span id="streak-display">🔥 Streak: 0</span>
                <span id="timer-display">⏱️ 15s</span>
            </div>
            
            <div class="timer-bar-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>

            <div class="quiz-info" id="quiz-mode-title">กำลังโหลดรูปแบบการทดสอบ...</div>
            <div class="question" id="question-text">กำลังโหลดคำถาม...</div>
            <div class="options" id="options-container"></div>

            <div class="lifelines">
                <button class="btn-lifeline" id="btn-5050" onclick="useFiftyFifty()">⚡ ตัดช้อยส์ 50/50</button>
                <button class="btn-skip" id="btn-skip-q" onclick="skipQuestion()">⏭️ ข้ามข้อนี้</button>
            </div>
        </div>

        <div id="result-container" style="display: none;">
            <h2>📊 สรุปสถิติการทดสอบ</h2>
            <div class="stats-grid" id="stats-summary"></div>
            <button class="btn-restart" onclick="initQuiz()">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        // คลังคำศัพท์ (คุณสามารถนำรายการคำศัพท์ทั้ง 550 คำมาวางต่อในนี้ได้เลยครับ)
        const allVocabulary = [
            { word: "Ability", meaning: "ความสามารถ" },
            { word: "Absolute", meaning: "แน่นอน, สมบูรณ์" },
            { word: "Accelerate", meaning: "เร่งความเร็ว" },
            { word: "Accept", meaning: "ยอมรับ" },
            { word: "Access", meaning: "การเข้าถึง" },
            { word: "Accomplish", meaning: "ทำสำเร็จ" },
            { word: "Accurate", meaning: "แม่นยำ" },
            { word: "Achieve", meaning: "บรรลุเป้าหมาย" },
            { word: "Acknowledge", meaning: "ยอมรับ, รับรู้" },
            { word: "Acquire", meaning: "ได้รับ" },
            { word: "Active", meaning: "กระฉับกระเฉง" },
            { word: "Adapt", meaning: "ปรับตัว" },
            { word: "Add", meaning: "เพิ่ม" },
            { word: "Address", meaning: "ที่อยู่, จัดการ" },
            { word: "Adjust", meaning: "ปรับเปลี่ยน" },
            { word: "Administer", meaning: "จัดการ, บริหาร" },
            { word: "Admire", meaning: "ชมเชย, ชื่นชม" },
            { word: "Admit", meaning: "ยอมรับ" },
            { word: "Adopt", meaning: "รับเลี้ยง, นำมาใช้" },
            { word: "Advance", meaning: "ล่วงหน้า, พัฒนา" },
            { word: "Advantage", meaning: "ข้อได้เปรียบ" },
            { word: "Advertise", meaning: "โฆษณา" },
            { word: "Advice", meaning: "คำแนะนำ" },
            { word: "Advise", meaning: "แนะนำ" },
            { word: "Affect", meaning: "มีผลกระทบ" },
            { word: "Afford", meaning: "สามารถซื้อได้" },
            { word: "Agency", meaning: "หน่วยงาน" },
            { word: "Agenda", meaning: "วาระการประชุม" },
            { word: "Agent", meaning: "ตัวแทน" },
            { word: "Agree", meaning: "เห็นด้วย" },
            { word: "Ahead", meaning: "ข้างหน้า" },
            { word: "Aid", meaning: "ความช่วยเหลือ" },
            { word: "Aim", meaning: "เป้าหมาย, เล็ง" },
            { word: "Air", meaning: "อากาศ" },
            { word: "Aircraft", meaning: "อากาศยาน" },
            { word: "Airline", meaning: "สายการบิน" },
            { word: "Airport", meaning: "สนามบิน" },
            { word: "Alarm", meaning: "นาฬิกาปลุก, สัญญาณเตือน" },
            { word: "Album", meaning: "อัลบั้ม" },
            { word: "Alcohol", meaning: "แอลกอฮอล์" },
            { word: "Alive", meaning: "ยังมีชีวิตอยู่" },
            { word: "Allow", meaning: "อนุญาต" },
            { word: "Almost", meaning: "เกือบจะ" },
            { word: "Alone", meaning: "คนเดียว" },
            { word: "Along", meaning: "ตามทาง" },
            { word: "Already", meaning: "เรียบร้อยแล้ว" },
            { word: "Also", meaning: "ด้วย, เช่นกัน" },
            { word: "Alternative", meaning: "ทางเลือก" },
            { word: "Although", meaning: "แม้ว่า" },
            { word: "Always", meaning: "เสมอ" }
  
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let xp = 0;
        let streak = 0;
        let maxStreak = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let currentQuizType = 1;
        
        const TOTAL_TIME = 15;
        let timeLeft = TOTAL_TIME;
        let timerInterval;
        let lifelineUsed5050 = false;
        let skipUsedCount = 0;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            xp = 0;
            streak = 0;
            maxStreak = 0;
            correctCount = 0;
            wrongCount = 0;
            currentIndex = 0;
            lifelineUsed5050 = false;
            skipUsedCount = 0;

            document.getElementById('quiz-app').style.display = 'block';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('btn-5050').disabled = false;
            document.getElementById('btn-skip-q').disabled = false;

            currentQuizType = Math.floor(Math.random() * 15) + 1;
            document.getElementById('quiz-mode-title').innerText = `🧩 รูปแบบคำถามชุดที่ ${currentQuizType} / 15`;

            let shuffledVocab = [...allVocabulary];
            shuffle(shuffledVocab);
            currentQuestions = shuffledVocab.slice(0, 10);

            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TOTAL_TIME;
            document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
            let timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
                timerBar.style.width = `${(timeLeft / TOTAL_TIME) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            streak = 0;
            wrongCount++;
            updateStatsDisplay();
            currentIndex++;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                clearInterval(timerInterval);
                showResult();
                return;
            }

            startTimer();
            const currentItem = currentQuestions[currentIndex];
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            if (currentQuizType % 2 === 1) {
                questionText.innerText = `ข้อที่ ${currentIndex + 1}: ความหมายของ "${currentItem.word}" คืออะไร?`;
                let incorrectOptions = allVocabulary.filter(v => v.meaning !== currentItem.meaning).map(v => v.meaning);
                shuffle(incorrectOptions);
                
                let options = [currentItem.meaning, ...incorrectOptions.slice(0, 3)];
                shuffle(options);

                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.innerText = option;
                    btn.onclick = () => checkAnswer(option, currentItem.meaning);
                    optionsContainer.appendChild(btn);
                });
            } else {
                questionText.innerText = `ข้อที่ ${currentIndex + 1}: คำศัพท์ใดตรงกับความหมาย "${currentItem.meaning}"?`;
                let incorrectOptions = allVocabulary.filter(v => v.word !== currentItem.word).map(v => v.word);
                shuffle(incorrectOptions);
                
                let options = [currentItem.word, ...incorrectOptions.slice(0, 3)];
                shuffle(options);

                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.innerText = option;
                    btn.onclick = () => checkAnswer(option, currentItem.word);
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function checkAnswer(selected, correct) {
            clearInterval(timerInterval);
            const buttons = document.querySelectorAll('#options-container button');

            if (selected === correct) {
                correctCount++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                xp += 10 + (streak * 2) + (timeLeft * 1);
                
                buttons.forEach(btn => {
                    if (btn.innerText === correct) btn.style.backgroundColor = '#2ed573';
                    if (btn.innerText === selected && selected !== correct) btn.style.backgroundColor = '#ff4757';
                    btn.disabled = true;
                });
            } else {
                wrongCount++;
                streak = 0;
                buttons.forEach(btn => {
                    if (btn.innerText === correct) btn.style.backgroundColor = '#2ed573';
                    if (btn.innerText === selected) btn.style.backgroundColor = '#ff4757';
                    btn.disabled = true;
                });
            }

            updateStatsDisplay();
            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1000);
        }

        function useFiftyFifty() {
            if (lifelineUsed5050) return;
            lifelineUsed5050 = true;
            document.getElementById('btn-5050').disabled = true;

            const currentItem = currentQuestions[currentIndex];
            const buttons = Array.from(document.querySelectorAll('#options-container button'));
            
            let hiddenCount = 0;
            buttons.forEach(btn => {
                const isCorrect = (currentQuizType % 2 === 1) ? (btn.innerText === currentItem.meaning) : (btn.innerText === currentItem.word);
                if (!isCorrect && hiddenCount < 2) {
                    btn.classList.add('hidden-option');
                    hiddenCount++;
                }
            });
        }

        function skipQuestion() {
            clearInterval(timerInterval);
            skipUsedCount++;
            document.getElementById('btn-skip-q').disabled = true; 
            currentIndex++;
            loadQuestion();
        }

        function updateStatsDisplay() {
            document.getElementById('score-display').innerText = `🏆 แต้ม XP: ${xp}`;
            document.getElementById('streak-display').innerText = `🔥 Streak: ${streak}`;
        }

        function showResult() {
            document.getElementById('quiz-app').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';

            let accuracy = Math.round((correctCount / currentQuestions.length) * 100) || 0;

            document.getElementById('stats-summary').innerHTML = `
                <div>✨ <b>แต้ม XP รวม:</b> ${xp} XP</div>
                <div>🎯 <b>ความแม่นยำ:</b> ${accuracy}%</div>
                <div>✅ <b>ตอบถูก:</b> ${correctCount} ข้อ</div>
                <div>❌ <b>ตอบผิด:</b> ${wrongCount} ข้อ</div>
                <div>🔥 <b>Streak สูงสุด:</b> ${maxStreak} ข้อติด</div>
                <div>⏭️ <b>ข้ามข้อ:</b> ${skipUsedCount} ครั้ง</div>
            `;
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
